# Stack del lab 09-02: llama serve + Caddy (HTTPS) + Prometheus + Grafana
# Avvio: docker compose up -d      Stato: docker compose ps      Log: docker compose logs -f llama
services:
  llama:
    image: ghcr.io/ggml-org/llama.cpp:server-b11046   # tag fissato alla build: "server" da solo cambia ogni giorno
    restart: unless-stopped
    volumes:
      - ./models:/models:ro
    environment:
      LLAMA_ARG_HOST: 0.0.0.0          # solo dentro la rete di Compose: nessuna porta pubblicata
      LLAMA_ARG_PORT: 8080
      LLAMA_ARG_MODEL: /models/Qwen3.5-0.8B-Q8_0.gguf
      LLAMA_ARG_ALIAS: qwen-0.8b
      LLAMA_ARG_CTX_SIZE: 8192
      LLAMA_ARG_N_PARALLEL: 2
      LLAMA_ARG_THREADS: 4
      LLAMA_ARG_ENDPOINT_METRICS: 1
      LLAMA_ARG_API_KEY_FILE: /run/secrets/llama_keys
      LLAMA_ARG_UI: 0                  # solo API (rimetti 1 se vuoi la web UI dietro basic_auth)
    secrets:
      - llama_keys
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 120s               # tempo per caricare il modello prima che i fallimenti contino
    deploy:
      resources:
        limits:
          memory: 6g

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "8443:443"                     # https://localhost:8443 (certificato interno di Caddy)
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      llama:
        condition: service_healthy     # niente 502: Caddy parte quando /health risponde 200

  prometheus:
    image: prom/prometheus:v3.5.0
    restart: unless-stopped
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prom_data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"          # solo dal host: http://localhost:9090
    depends_on:
      - llama

  grafana:
    image: grafana/grafana:12.1.0
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: cambiami
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"          # solo dal host: http://localhost:3000 (admin / cambiami)
    depends_on:
      - prometheus

secrets:
  llama_keys:
    file: ./api-keys.txt

volumes:
  caddy_data:
  caddy_config:
  prom_data:
  grafana_data:
