<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="900" height="480" font-family="sans-serif" font-size="14">
  <title>Server HTTP oppure libreria incorporata: come integrare llama.cpp</title>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6b7280"/>
    </marker>
  </defs>

  <!-- La tua app -->
  <rect x="350" y="20" width="200" height="60" rx="12" fill="#f3f4f6" stroke="#6b7280" stroke-width="2"/>
  <text x="450" y="45" text-anchor="middle" font-weight="700" fill="#111827">la tua applicazione</text>
  <text x="450" y="66" text-anchor="middle" font-size="12" fill="#374151">Python · JS · C++ · Swift · Kotlin…</text>

  <line x1="400" y1="80" x2="235" y2="118" stroke="#6b7280" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="500" y1="80" x2="665" y2="118" stroke="#6b7280" stroke-width="2" marker-end="url(#ar)"/>
  <text x="290" y="92" text-anchor="middle" font-size="12" fill="#374151">HTTP / JSON</text>
  <text x="615" y="92" text-anchor="middle" font-size="12" fill="#374151">chiamate in-process</text>

  <!-- Colonna A: server -->
  <rect x="30" y="120" width="410" height="340" rx="12" fill="#ccfbf1" stroke="#0d9488" stroke-width="2"/>
  <text x="235" y="148" text-anchor="middle" font-weight="700" font-size="16" fill="#134e4a">A · Server HTTP: llama serve</text>
  <text x="235" y="168" text-anchor="middle" font-size="12" fill="#134e4a">processo separato, API compatibile OpenAI</text>
  <line x1="50" y1="180" x2="420" y2="180" stroke="#0d9488" stroke-width="1"/>
  <g fill="#134e4a" font-size="13">
    <text x="50" y="204" font-weight="700">Pro</text>
    <text x="50" y="224">+ qualsiasi linguaggio: basta un client HTTP (SDK openai)</text>
    <text x="50" y="244">+ un solo modello in RAM per tutte le app e gli utenti</text>
    <text x="50" y="264">+ batching continuo, slot, cache del prompt, web UI</text>
    <text x="50" y="284">+ aggiorni llama.cpp senza ricompilare l'app</text>
    <text x="50" y="304">+ router: più modelli, caricati su richiesta</text>
    <text x="50" y="334" font-weight="700">Contro</text>
    <text x="50" y="354">− un processo in più da avviare e sorvegliare</text>
    <text x="50" y="374">− latenza di rete (piccola in locale) e serializzazione JSON</text>
    <text x="50" y="394">− niente accesso diretto a logit, KV cache, batch</text>
    <text x="50" y="424" font-weight="700">Quando</text>
    <text x="50" y="444">servizi, web app, più client, prototipi, RAG</text>
  </g>

  <!-- Colonna B: libreria -->
  <rect x="460" y="120" width="410" height="340" rx="12" fill="#ffedd5" stroke="#f97316" stroke-width="2"/>
  <text x="665" y="148" text-anchor="middle" font-weight="700" font-size="16" fill="#7c2d12">B · Libreria incorporata: libllama</text>
  <text x="665" y="168" text-anchor="middle" font-size="12" fill="#7c2d12">C API, oppure un binding (Python, Node, Swift, .NET…)</text>
  <line x1="480" y1="180" x2="850" y2="180" stroke="#f97316" stroke-width="1"/>
  <g fill="#7c2d12" font-size="13">
    <text x="480" y="204" font-weight="700">Pro</text>
    <text x="480" y="224">+ nessun processo esterno: un solo eseguibile da distribuire</text>
    <text x="480" y="244">+ controllo totale: token, logit, sampler, KV cache</text>
    <text x="480" y="264">+ indispensabile su mobile (iOS, Android) e offline</text>
    <text x="480" y="284">+ latenza minima, niente HTTP</text>
    <text x="480" y="304">+ funziona anche senza rete e senza porte aperte</text>
    <text x="480" y="334" font-weight="700">Contro</text>
    <text x="480" y="354">− devi compilare/linkare la libreria per ogni piattaforma</text>
    <text x="480" y="374">− API in evoluzione: i binding restano indietro</text>
    <text x="480" y="394">− ogni processo carica la sua copia del modello</text>
    <text x="480" y="424" font-weight="700">Quando</text>
    <text x="480" y="444">app desktop/mobile, strumenti CLI, ricerca sul decoding</text>
  </g>
</svg>
