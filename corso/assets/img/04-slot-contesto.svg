<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470" font-family="sans-serif">
  <title>Come -c si divide fra gli slot di llama serve</title>
  <!-- sfondo neutro leggibile in chiaro e scuro -->
  <rect x="0" y="0" width="900" height="470" rx="12" fill="#f3f4f6"/>
  <text x="450" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#111827">Contesto (-c) e slot (-np) in llama serve</text>

  <!-- Caso 1: -np 1 -->
  <text x="30" y="80" font-size="15" font-weight="700" fill="#111827">-c 4096 -np 1</text>
  <rect x="30" y="92" width="840" height="46" rx="6" fill="#ccfbf1" stroke="#0f766e" stroke-width="2"/>
  <text x="450" y="121" text-anchor="middle" font-size="15" fill="#134e4a">slot 0 · n_ctx_slot = 4096 token (una richiesta alla volta, ma con tutto il contesto)</text>

  <!-- Caso 2: -np 2 -->
  <text x="30" y="178" font-size="15" font-weight="700" fill="#111827">-c 4096 -np 2</text>
  <rect x="30" y="190" width="416" height="46" rx="6" fill="#ffedd5" stroke="#c2410c" stroke-width="2"/>
  <text x="238" y="219" text-anchor="middle" font-size="15" fill="#7c2d12">slot 0 · n_ctx_slot = 2048</text>
  <rect x="454" y="190" width="416" height="46" rx="6" fill="#ffedd5" stroke="#c2410c" stroke-width="2"/>
  <text x="662" y="219" text-anchor="middle" font-size="15" fill="#7c2d12">slot 1 · n_ctx_slot = 2048</text>

  <!-- Caso 3: -np 4 -->
  <text x="30" y="276" font-size="15" font-weight="700" fill="#111827">-c 4096 -np 4</text>
  <g fill="#e0e7ff" stroke="#3730a3" stroke-width="2">
    <rect x="30" y="288" width="204" height="46" rx="6"/>
    <rect x="242" y="288" width="204" height="46" rx="6"/>
    <rect x="454" y="288" width="204" height="46" rx="6"/>
    <rect x="666" y="288" width="204" height="46" rx="6"/>
  </g>
  <g font-size="14" fill="#312e81" text-anchor="middle">
    <text x="132" y="317">slot 0 · 1024</text>
    <text x="344" y="317">slot 1 · 1024</text>
    <text x="556" y="317">slot 2 · 1024</text>
    <text x="768" y="317">slot 3 · 1024</text>
  </g>

  <!-- Caso 4: kv-unified -->
  <text x="30" y="374" font-size="15" font-weight="700" fill="#111827">-c 4096 -np 4 --kv-unified</text>
  <rect x="30" y="386" width="840" height="46" rx="6" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
  <text x="450" y="407" text-anchor="middle" font-size="14" fill="#78350f">un solo buffer KV da 4096 token condiviso: gli slot attivi se lo spartiscono dinamicamente</text>
  <text x="450" y="425" text-anchor="middle" font-size="13" fill="#78350f">(una richiesta lunga può usare più di 1024 token, finché il totale sta in 4096)</text>

  <!-- nota in fondo -->
  <text x="450" y="458" text-anchor="middle" font-size="13" fill="#374151">La memoria della KV cache è sempre proporzionale a -c: aumentare -np senza aumentare -c non costa RAM ma riduce il contesto per richiesta.</text>
</svg>
