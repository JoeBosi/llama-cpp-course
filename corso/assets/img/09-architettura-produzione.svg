<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" width="900" height="430" font-family="sans-serif" font-size="14">
  <defs>
    <marker id="freccia" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,4 L0,8 z" fill="#374151"/>
    </marker>
    <marker id="freccia-viola" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,4 L0,8 z" fill="#5b21b6"/>
    </marker>
  </defs>

  <!-- Sfondo pieno: leggibile su tema chiaro e scuro -->
  <rect x="0" y="0" width="900" height="430" rx="12" fill="#f3f4f6" stroke="#9ca3af"/>

  <!-- Zona "internet" -->
  <rect x="20" y="120" width="150" height="130" rx="10" fill="#e0e7ff" stroke="#312e81"/>
  <text x="95" y="145" text-anchor="middle" fill="#312e81" font-weight="bold">Client</text>
  <text x="95" y="170" text-anchor="middle" fill="#312e81" font-size="12">browser, curl,</text>
  <text x="95" y="188" text-anchor="middle" fill="#312e81" font-size="12">SDK openai, app</text>
  <text x="95" y="225" text-anchor="middle" fill="#312e81" font-size="12">Authorization: Bearer …</text>

  <!-- Freccia client -> caddy -->
  <line x1="170" y1="185" x2="235" y2="185" stroke="#374151" stroke-width="2" marker-end="url(#freccia)"/>
  <text x="203" y="172" text-anchor="middle" fill="#111827" font-size="12">HTTPS :443</text>

  <!-- Bordo della macchina -->
  <rect x="240" y="30" width="640" height="380" rx="12" fill="none" stroke="#111827" stroke-dasharray="6 4"/>
  <text x="560" y="52" text-anchor="middle" fill="#111827" font-size="12" font-style="italic">macchina/VPS: solo la porta 443 è aperta verso l'esterno</text>

  <!-- Caddy -->
  <rect x="260" y="120" width="170" height="130" rx="10" fill="#ffedd5" stroke="#7c2d12"/>
  <text x="345" y="145" text-anchor="middle" fill="#7c2d12" font-weight="bold">Caddy</text>
  <text x="345" y="168" text-anchor="middle" fill="#7c2d12" font-size="12">TLS automatico (Let's Encrypt)</text>
  <text x="345" y="186" text-anchor="middle" fill="#7c2d12" font-size="12">basic_auth o Bearer</text>
  <text x="345" y="204" text-anchor="middle" fill="#7c2d12" font-size="12">rate limit · log accessi</text>
  <text x="345" y="230" text-anchor="middle" fill="#7c2d12" font-size="12">@noauth path /health</text>

  <!-- Freccia caddy -> llama serve -->
  <line x1="430" y1="185" x2="495" y2="185" stroke="#374151" stroke-width="2" marker-end="url(#freccia)"/>
  <text x="463" y="172" text-anchor="middle" fill="#111827" font-size="12">HTTP</text>
  <text x="463" y="205" text-anchor="middle" fill="#111827" font-size="11">127.0.0.1:8080</text>

  <!-- llama serve -->
  <rect x="500" y="90" width="230" height="200" rx="10" fill="#ccfbf1" stroke="#134e4a"/>
  <text x="615" y="115" text-anchor="middle" fill="#134e4a" font-weight="bold">llama serve (systemd / Compose)</text>
  <text x="615" y="134" text-anchor="middle" fill="#134e4a" font-size="12">--host 127.0.0.1 --api-key-file …</text>
  <text x="615" y="152" text-anchor="middle" fill="#134e4a" font-size="12">--metrics  -c 8192  -np 2</text>
  <!-- slot -->
  <rect x="515" y="165" width="95" height="60" rx="6" fill="#99f6e4" stroke="#134e4a"/>
  <text x="562" y="188" text-anchor="middle" fill="#134e4a" font-size="12" font-weight="bold">slot 0</text>
  <text x="562" y="206" text-anchor="middle" fill="#134e4a" font-size="11">4096 token</text>
  <rect x="620" y="165" width="95" height="60" rx="6" fill="#99f6e4" stroke="#134e4a"/>
  <text x="667" y="188" text-anchor="middle" fill="#134e4a" font-size="12" font-weight="bold">slot 1</text>
  <text x="667" y="206" text-anchor="middle" fill="#134e4a" font-size="11">4096 token</text>
  <text x="615" y="250" text-anchor="middle" fill="#134e4a" font-size="12">modello GGUF + KV cache in RAM/VRAM</text>
  <text x="615" y="270" text-anchor="middle" fill="#134e4a" font-size="12">coda: requests_deferred se gli slot sono pieni</text>

  <!-- Log -->
  <rect x="750" y="120" width="115" height="70" rx="10" fill="#f3f4f6" stroke="#111827"/>
  <text x="807" y="145" text-anchor="middle" fill="#111827" font-weight="bold" font-size="13">journald</text>
  <text x="807" y="165" text-anchor="middle" fill="#111827" font-size="11">--log-jsonl</text>
  <text x="807" y="181" text-anchor="middle" fill="#111827" font-size="11">docker logs</text>
  <line x1="730" y1="155" x2="745" y2="155" stroke="#374151" stroke-width="2" marker-end="url(#freccia)"/>

  <!-- Monitoraggio -->
  <rect x="500" y="320" width="150" height="75" rx="10" fill="#ede9fe" stroke="#5b21b6"/>
  <text x="575" y="345" text-anchor="middle" fill="#5b21b6" font-weight="bold">Prometheus</text>
  <text x="575" y="365" text-anchor="middle" fill="#5b21b6" font-size="11">scrape GET /metrics</text>
  <text x="575" y="382" text-anchor="middle" fill="#5b21b6" font-size="11">ogni 15 s</text>
  <line x1="575" y1="320" x2="600" y2="292" stroke="#5b21b6" stroke-width="2" marker-end="url(#freccia-viola)"/>
  <text x="520" y="308" text-anchor="middle" fill="#5b21b6" font-size="11">llamacpp:*</text>

  <rect x="700" y="320" width="150" height="75" rx="10" fill="#ede9fe" stroke="#5b21b6"/>
  <text x="775" y="345" text-anchor="middle" fill="#5b21b6" font-weight="bold">Grafana</text>
  <text x="775" y="365" text-anchor="middle" fill="#5b21b6" font-size="11">token/s, slot occupati,</text>
  <text x="775" y="382" text-anchor="middle" fill="#5b21b6" font-size="11">richieste in coda</text>
  <line x1="650" y1="357" x2="695" y2="357" stroke="#5b21b6" stroke-width="2" marker-end="url(#freccia-viola)"/>

  <!-- Health check -->
  <rect x="260" y="320" width="170" height="75" rx="10" fill="#ffedd5" stroke="#7c2d12"/>
  <text x="345" y="345" text-anchor="middle" fill="#7c2d12" font-weight="bold" font-size="13">healthcheck</text>
  <text x="345" y="365" text-anchor="middle" fill="#7c2d12" font-size="11">GET /health → 200 ok</text>
  <text x="345" y="382" text-anchor="middle" fill="#7c2d12" font-size="11">503 = modello in caricamento</text>
  <line x1="430" y1="357" x2="520" y2="292" stroke="#374151" stroke-width="2" marker-end="url(#freccia)"/>
</svg>
