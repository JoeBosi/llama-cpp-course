<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="900" height="480" font-family="sans-serif" font-size="14">
  <title>HTTP server or embedded library: how to integrate llama.cpp</title>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6b7280"/>
    </marker>
  </defs>

  <!-- La tua app -->
  <rect x="350" y="20" width="200" height="60" rx="12" fill="#f3f4f6" stroke="#6b7280" stroke-width="2"/>
  <text x="450" y="45" text-anchor="middle" font-weight="700" fill="#111827">your application</text>
  <text x="450" y="66" text-anchor="middle" font-size="12" fill="#374151">Python · JS · C++ · Swift · Kotlin…</text>

  <line x1="400" y1="80" x2="235" y2="118" stroke="#6b7280" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="500" y1="80" x2="665" y2="118" stroke="#6b7280" stroke-width="2" marker-end="url(#ar)"/>
  <text x="290" y="92" text-anchor="middle" font-size="12" fill="#374151">HTTP / JSON</text>
  <text x="615" y="92" text-anchor="middle" font-size="12" fill="#374151">in-process calls</text>

  <!-- Colonna A: server -->
  <rect x="30" y="120" width="410" height="340" rx="12" fill="#ccfbf1" stroke="#0d9488" stroke-width="2"/>
  <text x="235" y="148" text-anchor="middle" font-weight="700" font-size="16" fill="#134e4a">A · HTTP server: llama serve</text>
  <text x="235" y="168" text-anchor="middle" font-size="12" fill="#134e4a">separate process, OpenAI-compatible API</text>
  <line x1="50" y1="180" x2="420" y2="180" stroke="#0d9488" stroke-width="1"/>
  <g fill="#134e4a" font-size="13">
    <text x="50" y="204" font-weight="700">Pro</text>
    <text x="50" y="224">+ any language: an HTTP client is enough (openai SDK)</text>
    <text x="50" y="244">+ one model in RAM for all apps and users</text>
    <text x="50" y="264">+ continuous batching, slots, prompt cache, web UI</text>
    <text x="50" y="284">+ update llama.cpp without rebuilding the app</text>
    <text x="50" y="304">+ router: multiple models, loaded on demand</text>
    <text x="50" y="334" font-weight="700">Cons</text>
    <text x="50" y="354">− one more process to start and monitor</text>
    <text x="50" y="374">− network latency (small locally) and JSON serialization</text>
    <text x="50" y="394">− no direct access to logits, KV cache, batch</text>
    <text x="50" y="424" font-weight="700">When</text>
    <text x="50" y="444">services, web apps, multiple clients, prototypes, RAG</text>
  </g>

  <!-- Colonna B: libreria -->
  <rect x="460" y="120" width="410" height="340" rx="12" fill="#ffedd5" stroke="#f97316" stroke-width="2"/>
  <text x="665" y="148" text-anchor="middle" font-weight="700" font-size="16" fill="#7c2d12">B · Embedded library: libllama</text>
  <text x="665" y="168" text-anchor="middle" font-size="12" fill="#7c2d12">C API, or a binding (Python, Node, Swift, .NET…)</text>
  <line x1="480" y1="180" x2="850" y2="180" stroke="#f97316" stroke-width="1"/>
  <g fill="#7c2d12" font-size="13">
    <text x="480" y="204" font-weight="700">Pro</text>
    <text x="480" y="224">+ no external process: a single executable to ship</text>
    <text x="480" y="244">+ full control: tokens, logits, sampler, KV cache</text>
    <text x="480" y="264">+ essential on mobile (iOS, Android) and offline</text>
    <text x="480" y="284">+ minimal latency, no HTTP</text>
    <text x="480" y="304">+ works without a network and without open ports</text>
    <text x="480" y="334" font-weight="700">Cons</text>
    <text x="480" y="354">− you build/link the library for every platform</text>
    <text x="480" y="374">− evolving API: bindings lag behind</text>
    <text x="480" y="394">− each process loads its own copy of the model</text>
    <text x="480" y="424" font-weight="700">When</text>
    <text x="480" y="444">desktop/mobile apps, CLI tools, decoding research</text>
  </g>
</svg>
