<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" width="900" height="430" font-family="sans-serif" font-size="14">
  <defs>
    <marker id="fr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="20" y="14" width="860" height="30" rx="6" fill="#f3f4f6"/>
  <text x="450" y="35" text-anchor="middle" fill="#111827" font-weight="bold" font-size="15">Memory used by a model in llama.cpp = weights + KV cache + overhead</text>

  <!-- barra a scala: esempio Qwen3-8B Q4_K_M, contesto 8192, f16 -->
  <text x="20" y="78" fill="#111827" font-size="13">Example: 8B model, Q4_K_M (4.85 bits/weight), 8,192-token context, F16 KV cache → about 6.2 GiB</text>
  <!-- scala: 120 px per GiB, origine x=40 -->
  <rect x="40" y="92" width="554" height="54" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5"/>
  <text x="317" y="115" text-anchor="middle" fill="#134e4a" font-weight="bold">WEIGHTS  4.62 GiB</text>
  <text x="317" y="134" text-anchor="middle" fill="#134e4a" font-size="12">8.19 G parameters × 4.85 bits / 8</text>

  <rect x="594" y="92" width="135" height="54" fill="#e0e7ff" stroke="#4338ca" stroke-width="1.5"/>
  <text x="661" y="115" text-anchor="middle" fill="#312e81" font-weight="bold">KV 1.12 GiB</text>
  <text x="661" y="134" text-anchor="middle" fill="#312e81" font-size="11">36 layers · 8 heads · 128</text>

  <rect x="729" y="92" width="57" height="54" fill="#ffedd5" stroke="#c2410c" stroke-width="1.5"/>
  <text x="757" y="115" text-anchor="middle" fill="#7c2d12" font-weight="bold" font-size="12">0.47</text>
  <text x="757" y="134" text-anchor="middle" fill="#7c2d12" font-size="11">extra</text>

  <!-- righello -->
  <line x1="40" y1="160" x2="800" y2="160" stroke="#64748b" stroke-width="1"/>
  <g fill="#64748b" font-size="11" text-anchor="middle">
    <line x1="40" y1="156" x2="40" y2="164" stroke="#64748b"/><text x="40" y="177">0</text>
    <line x1="160" y1="156" x2="160" y2="164" stroke="#64748b"/><text x="160" y="177">1 GiB</text>
    <line x1="280" y1="156" x2="280" y2="164" stroke="#64748b"/><text x="280" y="177">2</text>
    <line x1="400" y1="156" x2="400" y2="164" stroke="#64748b"/><text x="400" y="177">3</text>
    <line x1="520" y1="156" x2="520" y2="164" stroke="#64748b"/><text x="520" y="177">4</text>
    <line x1="640" y1="156" x2="640" y2="164" stroke="#64748b"/><text x="640" y="177">5</text>
    <line x1="760" y1="156" x2="760" y2="164" stroke="#64748b"/><text x="760" y="177">6</text>
  </g>

  <!-- tre schede di spiegazione -->
  <rect x="20" y="200" width="275" height="210" rx="10" fill="#ccfbf1" stroke="#0f766e"/>
  <g fill="#134e4a">
    <text x="157" y="226" text-anchor="middle" font-weight="bold" font-size="15">Weights</text>
    <text x="34" y="252" font-size="13">parameters × bits per weight / 8</text>
    <text x="34" y="276" font-size="12">Fixed: they depend only on the GGUF file.</text>
    <text x="34" y="294" font-size="12">With mmap they stay on disk and</text>
    <text x="34" y="312" font-size="12">are read on demand.</text>
    <text x="34" y="340" font-size="12" font-weight="bold">Reduced by:</text>
    <text x="34" y="358" font-size="12">• quantization (Q8 → Q4 halves)</text>
    <text x="34" y="376" font-size="12">• a smaller model</text>
    <text x="34" y="394" font-size="12">• -ngl: part in VRAM, part in RAM</text>
  </g>

  <rect x="312" y="200" width="275" height="210" rx="10" fill="#e0e7ff" stroke="#4338ca"/>
  <g fill="#312e81">
    <text x="449" y="226" text-anchor="middle" font-weight="bold" font-size="15">KV cache</text>
    <text x="326" y="252" font-size="13">2 × layers × KV heads × head_dim</text>
    <text x="326" y="270" font-size="13">   × context × bytes/element</text>
    <text x="326" y="294" font-size="12">Grows linearly with the context</text>
    <text x="326" y="312" font-size="12">(-c) and with parallel slots (-np).</text>
    <text x="326" y="340" font-size="12" font-weight="bold">Reduced by:</text>
    <text x="326" y="358" font-size="12">• shorter context (-c 4096)</text>
    <text x="326" y="376" font-size="12">• -ctk q8_0 -ctv q8_0 (half of F16)</text>
    <text x="326" y="394" font-size="12">• GQA / hybrid models (few KV heads)</text>
  </g>

  <rect x="604" y="200" width="275" height="210" rx="10" fill="#ffedd5" stroke="#c2410c"/>
  <g fill="#7c2d12">
    <text x="741" y="226" text-anchor="middle" font-weight="bold" font-size="15">Overhead</text>
    <text x="618" y="252" font-size="13">compute buffers + graph + extras</text>
    <text x="618" y="276" font-size="12">Batch activations (-b/-ub),</text>
    <text x="618" y="294" font-size="12">vocabulary logits, tokenizer,</text>
    <text x="618" y="312" font-size="12">multimodal projector (mmproj).</text>
    <text x="618" y="340" font-size="12" font-weight="bold">Rule of thumb:</text>
    <text x="618" y="358" font-size="12">• from 300 MiB to 10% of the weights</text>
    <text x="618" y="376" font-size="12">• more with large batches and huge</text>
    <text x="618" y="394" font-size="12">  vocabularies (250k tokens = heavy logits)</text>
  </g>
</svg>
