<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470" font-family="sans-serif">
  <rect width="900" height="470" rx="12" fill="#f8fafc"/>
  <text x="450" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#111827">Quale taglia di modello per quale macchina</text>
  <!-- asse -->
  <line x1="220" y1="400" x2="880" y2="400" stroke="#6b7280" stroke-width="2"/>
  <g font-size="12" fill="#374151" text-anchor="middle">
    <text x="220" y="420">0</text><text x="302" y="420">4 GB</text><text x="385" y="420">8 GB</text>
    <text x="550" y="420">16 GB</text><text x="715" y="420">24 GB</text><text x="880" y="420">32 GB</text>
    <text x="550" y="445" font-size="13" font-weight="600">memoria disponibile per il modello (RAM, memoria unificata o VRAM)</text>
  </g>
  <g stroke="#d1d5db" stroke-dasharray="4 4"><line x1="302" y1="50" x2="302" y2="400"/><line x1="385" y1="50" x2="385" y2="400"/><line x1="550" y1="50" x2="550" y2="400"/><line x1="715" y1="50" x2="715" y2="400"/></g>
  <!-- righe: y, etichetta, barra memoria usata (x2), modello -->
  <g font-size="13">
    <text x="20" y="80" fill="#111827" font-weight="600">Raspberry Pi 4/5</text>
    <rect x="220" y="62" width="30" height="26" rx="5" fill="#ccfbf1" stroke="#0f766e"/>
    <text x="260" y="80" fill="#134e4a">1–2B · LFM2.5-1.2B, Qwen3.5-0.8B · 3–8 t/s</text>

    <text x="20" y="130" fill="#111827" font-weight="600">Telefono Android</text>
    <rect x="220" y="112" width="40" height="26" rx="5" fill="#ccfbf1" stroke="#0f766e"/>
    <text x="270" y="130" fill="#134e4a">1–2B · LFM2.5-1.2B, Qwen3.5-2B · 5–15 t/s</text>

    <text x="20" y="180" fill="#111827" font-weight="600">Portatile 8 GB, no GPU</text>
    <rect x="220" y="162" width="70" height="26" rx="5" fill="#e0e7ff" stroke="#3730a3"/>
    <text x="300" y="180" fill="#312e81">2–4B · Qwen3.5-2B, gemma-3-4b-qat · 5–15 t/s</text>

    <text x="20" y="230" fill="#111827" font-weight="600">PC / Mac 16 GB</text>
    <rect x="220" y="212" width="150" height="26" rx="5" fill="#e0e7ff" stroke="#3730a3"/>
    <text x="380" y="230" fill="#312e81">4–12B · gemma-4-E4B, Qwen3.5-9B · PC 4–8 t/s, Mac 15–30 t/s</text>

    <text x="20" y="280" fill="#111827" font-weight="600">PC / Mac 32 GB</text>
    <rect x="220" y="262" width="440" height="26" rx="5" fill="#ffedd5" stroke="#c2410c"/>
    <text x="230" y="257" fill="#7c2d12">MoE 26–35B (3–4B attivi) · Qwen3.5-35B-A3B, gemma-4-26B-A4B · PC 8–12 t/s, Mac 30+ t/s</text>

    <text x="20" y="330" fill="#111827" font-weight="600">GPU 8–12 GB VRAM</text>
    <rect x="220" y="312" width="130" height="26" rx="5" fill="#fce7f3" stroke="#9d174d"/>
    <text x="360" y="330" fill="#831843">4–12B · Qwen3.5-9B, gemma-4-12B · 40–60 t/s</text>

    <text x="20" y="380" fill="#111827" font-weight="600">GPU 16–24 GB VRAM</text>
    <rect x="220" y="362" width="330" height="26" rx="5" fill="#fce7f3" stroke="#9d174d"/>
    <text x="230" y="357" fill="#831843">12–27B · gpt-oss-20b, Qwen3.5-27B, gemma-4-26B-A4B · 40–80+ t/s</text>
  </g>
  <text x="450" y="56" text-anchor="middle" font-size="12" fill="#6b7280">Q4_K_M ≈ 0,6 GB per miliardo di parametri · la barra è la memoria del modello consigliato · lascia il 40–50 % libero</text>
</svg>
