<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470" font-family="sans-serif" font-size="14">
  <defs>
    <marker id="freccia" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>

  <!-- LIVELLO 3: strumenti e integrazioni -->
  <rect x="20" y="20" width="860" height="130" rx="10" fill="#ffedd5" stroke="#fb923c" stroke-width="1.5"/>
  <text x="36" y="44" fill="#7c2d12" font-weight="bold" font-size="15">3 · Tools and integrations (what you use)</text>
  <g fill="#7c2d12">
    <rect x="36" y="58" width="120" height="36" rx="6" fill="#fff7ed" stroke="#fb923c"/>
    <text x="96" y="81" text-anchor="middle">llama cli</text>
    <rect x="166" y="58" width="120" height="36" rx="6" fill="#fff7ed" stroke="#fb923c"/>
    <text x="226" y="81" text-anchor="middle">llama serve</text>
    <rect x="296" y="58" width="120" height="36" rx="6" fill="#fff7ed" stroke="#fb923c"/>
    <text x="356" y="81" text-anchor="middle">llama bench</text>
    <rect x="426" y="58" width="130" height="36" rx="6" fill="#fff7ed" stroke="#fb923c"/>
    <text x="491" y="81" text-anchor="middle">llama quantize</text>
    <rect x="566" y="58" width="150" height="36" rx="6" fill="#fff7ed" stroke="#fb923c"/>
    <text x="641" y="81" text-anchor="middle">imatrix · perplexity</text>
    <rect x="726" y="58" width="140" height="36" rx="6" fill="#fff7ed" stroke="#fb923c"/>
    <text x="796" y="81" text-anchor="middle">mtmd · tts · rpc</text>

    <rect x="36" y="102" width="200" height="36" rx="6" fill="#fff7ed" stroke="#fb923c" stroke-dasharray="4 3"/>
    <text x="136" y="125" text-anchor="middle">llama-cpp-python</text>
    <rect x="246" y="102" width="150" height="36" rx="6" fill="#fff7ed" stroke="#fb923c" stroke-dasharray="4 3"/>
    <text x="321" y="125" text-anchor="middle">Ollama</text>
    <rect x="406" y="102" width="150" height="36" rx="6" fill="#fff7ed" stroke="#fb923c" stroke-dasharray="4 3"/>
    <text x="481" y="125" text-anchor="middle">LM Studio · Jan</text>
    <rect x="566" y="102" width="300" height="36" rx="6" fill="#fff7ed" stroke="#fb923c" stroke-dasharray="4 3"/>
    <text x="716" y="125" text-anchor="middle">your app (C/C++, Python, Node, …)</text>
  </g>

  <line x1="450" y1="150" x2="450" y2="176" stroke="#64748b" stroke-width="2" marker-end="url(#freccia)"/>
  <text x="462" y="168" fill="#64748b" font-size="12">C API in include/llama.h</text>

  <!-- LIVELLO 2: libllama -->
  <rect x="20" y="180" width="860" height="110" rx="10" fill="#e0e7ff" stroke="#818cf8" stroke-width="1.5"/>
  <text x="36" y="204" fill="#312e81" font-weight="bold" font-size="15">2 · libllama (the "model engine")</text>
  <g fill="#312e81">
    <rect x="36" y="218" width="150" height="56" rx="6" fill="#eef2ff" stroke="#818cf8"/>
    <text x="111" y="241" text-anchor="middle">GGUF loading</text>
    <text x="111" y="259" text-anchor="middle" font-size="12">mmap, metadata, tensors</text>
    <rect x="196" y="218" width="150" height="56" rx="6" fill="#eef2ff" stroke="#818cf8"/>
    <text x="271" y="241" text-anchor="middle">tokenizer</text>
    <text x="271" y="259" text-anchor="middle" font-size="12">BPE / SPM / WPM</text>
    <rect x="356" y="218" width="160" height="56" rx="6" fill="#eef2ff" stroke="#818cf8"/>
    <text x="436" y="241" text-anchor="middle">model graph</text>
    <text x="436" y="259" text-anchor="middle" font-size="12">architectures: llama, qwen, gemma…</text>
    <rect x="526" y="218" width="150" height="56" rx="6" fill="#eef2ff" stroke="#818cf8"/>
    <text x="601" y="241" text-anchor="middle">KV cache</text>
    <text x="601" y="259" text-anchor="middle" font-size="12">context memory</text>
    <rect x="686" y="218" width="180" height="56" rx="6" fill="#eef2ff" stroke="#818cf8"/>
    <text x="776" y="241" text-anchor="middle">sampling · grammars</text>
    <text x="776" y="259" text-anchor="middle" font-size="12">top-k, top-p, GBNF, JSON schema</text>
  </g>

  <line x1="450" y1="290" x2="450" y2="316" stroke="#64748b" stroke-width="2" marker-end="url(#freccia)"/>
  <text x="462" y="308" fill="#64748b" font-size="12">tensor operations (mul_mat, rope, softmax…)</text>

  <!-- LIVELLO 1: ggml -->
  <rect x="20" y="320" width="860" height="130" rx="10" fill="#ccfbf1" stroke="#2dd4bf" stroke-width="1.5"/>
  <text x="36" y="344" fill="#134e4a" font-weight="bold" font-size="15">1 · ggml (tensor library: quantized types, compute graph, backends)</text>
  <g fill="#134e4a">
    <rect x="36" y="358" width="110" height="36" rx="6" fill="#f0fdfa" stroke="#2dd4bf"/>
    <text x="91" y="381" text-anchor="middle">CPU</text>
    <rect x="156" y="358" width="110" height="36" rx="6" fill="#f0fdfa" stroke="#2dd4bf"/>
    <text x="211" y="381" text-anchor="middle">CUDA</text>
    <rect x="276" y="358" width="110" height="36" rx="6" fill="#f0fdfa" stroke="#2dd4bf"/>
    <text x="331" y="381" text-anchor="middle">Metal</text>
    <rect x="396" y="358" width="110" height="36" rx="6" fill="#f0fdfa" stroke="#2dd4bf"/>
    <text x="451" y="381" text-anchor="middle">Vulkan</text>
    <rect x="516" y="358" width="110" height="36" rx="6" fill="#f0fdfa" stroke="#2dd4bf"/>
    <text x="571" y="381" text-anchor="middle">HIP (AMD)</text>
    <rect x="636" y="358" width="110" height="36" rx="6" fill="#f0fdfa" stroke="#2dd4bf"/>
    <text x="691" y="381" text-anchor="middle">SYCL (Intel)</text>
    <rect x="756" y="358" width="110" height="36" rx="6" fill="#f0fdfa" stroke="#2dd4bf"/>
    <text x="811" y="381" text-anchor="middle">OpenCL · RPC</text>
    <text x="36" y="424" font-size="12">CPU: AVX2 / AVX-512 / AMX on x86, NEON / SME on ARM, RVV on RISC-V · the right variant is chosen at runtime (libggml-cpu-*.so)</text>
    <text x="36" y="442" font-size="12">Also: MUSA, CANN, OpenVINO, WebGPU, ZenDNN, Hexagon, zDNN, BLAS</text>
  </g>
</svg>
