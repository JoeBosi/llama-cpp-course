<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="900" height="500" font-family="sans-serif">
  <title>Come i filtri di campionamento riducono la distribuzione dei token</title>
  <rect x="0" y="0" width="900" height="500" rx="12" fill="#f3f4f6"/>
  <text x="450" y="32" text-anchor="middle" font-size="19" font-weight="700" fill="#111827">La catena di campionamento: da 248 320 logit a un token</text>
  <text x="450" y="54" text-anchor="middle" font-size="13" fill="#374151">ordine di default di llama.cpp: penalità → top-k → top-p → min-p → temperatura → estrazione casuale (seed)</text>

  <!-- pannello 1: distribuzione iniziale -->
  <g>
    <rect x="20" y="75" width="160" height="330" rx="8" fill="#e0e7ff" stroke="#3730a3" stroke-width="1.5"/>
    <text x="100" y="98" text-anchor="middle" font-size="13" font-weight="700" fill="#312e81">1. softmax dei logit</text>
    <text x="100" y="114" text-anchor="middle" font-size="11" fill="#312e81">(dopo le penalità)</text>
    <g fill="#4338ca">
      <rect x="34" y="200" width="14" height="160"/>
      <rect x="52" y="250" width="14" height="110"/>
      <rect x="70" y="290" width="14" height="70"/>
      <rect x="88" y="310" width="14" height="50"/>
      <rect x="106" y="325" width="14" height="35"/>
      <rect x="124" y="330" width="14" height="30"/>
      <rect x="142" y="335" width="14" height="25"/>
      <rect x="160" y="340" width="14" height="20"/>
    </g>
    <line x1="30" y1="360" x2="176" y2="360" stroke="#312e81" stroke-width="1"/>
    <g font-size="10" fill="#312e81" text-anchor="middle">
      <text x="41" y="373">.32</text><text x="59" y="373">.22</text><text x="77" y="373">.14</text><text x="95" y="373">.10</text>
      <text x="113" y="373">.07</text><text x="131" y="373">.06</text><text x="149" y="373">.05</text><text x="167" y="373">.04</text>
    </g>
    <text x="100" y="393" text-anchor="middle" font-size="11" fill="#312e81">+ 248 312 token minuscoli</text>
  </g>

  <path d="M184 240 L206 240" stroke="#374151" stroke-width="2" marker-end="url(#fr)"/>

  <!-- pannello 2: top-k -->
  <g>
    <rect x="210" y="75" width="160" height="330" rx="8" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5"/>
    <text x="290" y="98" text-anchor="middle" font-size="13" font-weight="700" fill="#134e4a">2. top-k = 5</text>
    <text x="290" y="114" text-anchor="middle" font-size="11" fill="#134e4a">tiene i 5 più probabili</text>
    <g fill="#0d9488">
      <rect x="224" y="200" width="14" height="160"/>
      <rect x="242" y="250" width="14" height="110"/>
      <rect x="260" y="290" width="14" height="70"/>
      <rect x="278" y="310" width="14" height="50"/>
      <rect x="296" y="325" width="14" height="35"/>
    </g>
    <g fill="#9ca3af">
      <rect x="314" y="330" width="14" height="30"/>
      <rect x="332" y="335" width="14" height="25"/>
      <rect x="350" y="340" width="14" height="20"/>
    </g>
    <line x1="310" y1="190" x2="310" y2="362" stroke="#b91c1c" stroke-width="2" stroke-dasharray="4 3"/>
    <line x1="220" y1="360" x2="366" y2="360" stroke="#134e4a" stroke-width="1"/>
    <text x="290" y="393" text-anchor="middle" font-size="11" fill="#134e4a">scartati 248 315 token</text>
  </g>

  <path d="M374 240 L396 240" stroke="#374151" stroke-width="2" marker-end="url(#fr)"/>

  <!-- pannello 3: top-p -->
  <g>
    <rect x="400" y="75" width="160" height="330" rx="8" fill="#ffedd5" stroke="#c2410c" stroke-width="1.5"/>
    <text x="480" y="98" text-anchor="middle" font-size="13" font-weight="700" fill="#7c2d12">3. top-p = 0,80</text>
    <text x="480" y="114" text-anchor="middle" font-size="11" fill="#7c2d12">somma cumulata ≥ 0,80</text>
    <g fill="#ea580c">
      <rect x="414" y="200" width="14" height="160"/>
      <rect x="432" y="250" width="14" height="110"/>
      <rect x="450" y="290" width="14" height="70"/>
      <rect x="468" y="310" width="14" height="50"/>
      <rect x="486" y="325" width="14" height="35"/>
    </g>
    <g font-size="10" fill="#7c2d12" text-anchor="middle">
      <text x="421" y="195">.32</text><text x="439" y="245">.54</text><text x="457" y="285">.68</text><text x="475" y="305">.78</text><text x="493" y="320">.85</text>
    </g>
    <line x1="500" y1="190" x2="500" y2="362" stroke="#b91c1c" stroke-width="2" stroke-dasharray="4 3"/>
    <line x1="410" y1="360" x2="556" y2="360" stroke="#7c2d12" stroke-width="1"/>
    <text x="480" y="380" text-anchor="middle" font-size="11" fill="#7c2d12">qui non taglia più di top-k:</text>
    <text x="480" y="395" text-anchor="middle" font-size="11" fill="#7c2d12">i filtri si sommano</text>
  </g>

  <path d="M564 240 L586 240" stroke="#374151" stroke-width="2" marker-end="url(#fr)"/>

  <!-- pannello 4: min-p -->
  <g>
    <rect x="590" y="75" width="160" height="330" rx="8" fill="#fce7f3" stroke="#be185d" stroke-width="1.5"/>
    <text x="670" y="98" text-anchor="middle" font-size="13" font-weight="700" fill="#831843">4. min-p = 0,30</text>
    <text x="670" y="114" text-anchor="middle" font-size="10" fill="#831843">soglia = 0,30 × 0,32 = 0,096</text>
    <g fill="#db2777">
      <rect x="604" y="200" width="14" height="160"/>
      <rect x="622" y="250" width="14" height="110"/>
      <rect x="640" y="290" width="14" height="70"/>
      <rect x="658" y="310" width="14" height="50"/>
    </g>
    <rect x="676" y="325" width="14" height="35" fill="#9ca3af"/>
    <line x1="598" y1="312" x2="742" y2="312" stroke="#b91c1c" stroke-width="2" stroke-dasharray="4 3"/>
    <text x="736" y="308" text-anchor="end" font-size="10" fill="#b91c1c">soglia</text>
    <line x1="600" y1="360" x2="746" y2="360" stroke="#831843" stroke-width="1"/>
    <text x="670" y="380" text-anchor="middle" font-size="11" fill="#831843">relativo al token migliore:</text>
    <text x="670" y="395" text-anchor="middle" font-size="11" fill="#831843">si adatta a ogni passo</text>
  </g>

  <path d="M754 240 L776 240" stroke="#374151" stroke-width="2" marker-end="url(#fr)"/>

  <!-- pannello 5: temperatura + estrazione -->
  <g>
    <rect x="780" y="75" width="105" height="330" rx="8" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
    <text x="832" y="98" text-anchor="middle" font-size="13" font-weight="700" fill="#78350f">5. temp</text>
    <text x="832" y="114" text-anchor="middle" font-size="11" fill="#78350f">poi estrazione</text>
    <!-- T = 0.4: accentua -->
    <text x="832" y="140" text-anchor="middle" font-size="10" fill="#78350f">T = 0,4</text>
    <g fill="#d97706">
      <rect x="800" y="150" width="12" height="60"/>
      <rect x="816" y="188" width="12" height="22"/>
      <rect x="832" y="200" width="12" height="10"/>
      <rect x="848" y="205" width="12" height="5"/>
    </g>
    <!-- T = 1.5: appiattisce -->
    <text x="832" y="232" text-anchor="middle" font-size="10" fill="#78350f">T = 1,5</text>
    <g fill="#d97706">
      <rect x="800" y="262" width="12" height="40"/>
      <rect x="816" y="268" width="12" height="34"/>
      <rect x="832" y="273" width="12" height="29"/>
      <rect x="848" y="277" width="12" height="25"/>
    </g>
    <text x="832" y="330" text-anchor="middle" font-size="11" fill="#78350f">rinormalizza,</text>
    <text x="832" y="345" text-anchor="middle" font-size="11" fill="#78350f">estrae a caso</text>
    <text x="832" y="360" text-anchor="middle" font-size="11" fill="#78350f">(--seed)</text>
    <text x="832" y="390" text-anchor="middle" font-size="11" font-weight="700" fill="#78350f">T = 0 → greedy</text>
  </g>

  <!-- nota in basso -->
  <rect x="20" y="420" width="865" height="62" rx="8" fill="#e5e7eb" stroke="#6b7280" stroke-width="1"/>
  <text x="32" y="442" font-size="12" fill="#111827">Default: --top-k 40 · --top-p 0.95 · --min-p 0.05 · --temp 0.8 · --repeat-penalty 1.0 (spento) · --seed -1 (casuale).</text>
  <text x="32" y="460" font-size="12" fill="#111827">Valore neutro = filtro spento: top-k 0, top-p 1.0, min-p 0.0. Con --temp 0 la scelta è greedy e il seed non conta.</text>
  <text x="32" y="476" font-size="12" fill="#111827">L'ordine si cambia con --samplers "top_k;top_p;min_p;temperature" (penalties, dry, typ_p, xtc… opzionali).</text>

  <defs>
    <marker id="fr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#374151"/>
    </marker>
  </defs>
</svg>
