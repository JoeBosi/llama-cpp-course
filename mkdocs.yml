site_name: Corso pratico di llama.cpp
site_url: https://corso-llamacpp.giuseppebosi.com/
site_description: Guida e corso pratico su llama.cpp, dall'installazione alla produzione. Aggiornato a settembre 2026.
site_author: Giuseppe Bosi
docs_dir: corso
hooks:
  - scripts/visibilita.py
site_dir: site
copyright: '© 2026 <a href="https://www.giuseppebosi.com">Prof. Giuseppe Bosi</a>, Dottore in Ingegneria Elettronica (V.O.), Professore di Scienze e Tecnologie Informatiche · <a href="https://www.linkedin.com/in/giuseppebosi">LinkedIn</a> · testi e schemi <a href="https://creativecommons.org/licenses/by/4.0/deed.it">CC BY 4.0</a>, codice dei laboratori MIT · <a href="/informazioni/">Informazioni</a> · llama.cpp è un progetto MIT di ggml-org, non affiliato · <a href="https://github.com/JoeBosi/llama-cpp-course">Source code on GitHub</a> · Altri corsi: <a href="https://corso-api-json.giuseppebosi.com/">JSON & API</a>, <a href="https://corso-rag.giuseppebosi.com/">RAG</a>'

theme:
  name: material
  custom_dir: overrides
  language: it
  font: false                # niente Google Fonts: nessuna richiesta a terzi dal browser dei visitatori
  logo: assets/img/logo.svg
  favicon: assets/img/logo.svg
  palette:
    # Chiaro (default)
    - scheme: default
      primary: teal
      accent: deep orange
      toggle:
        icon: material/weather-night
        name: Passa al tema scuro
    - scheme: slate
      primary: teal
      accent: deep orange
      toggle:
        icon: material/weather-sunny
        name: Passa al tema chiaro
  features:
    - navigation.instant       # niente ricarica di pagina: la barra in alto resta lo stesso elemento, non può più "sfarfallare" da un clic all'altro
    - navigation.instant.progress
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.prune
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - navigation.path
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - content.tooltips
  icon:
    repo: fontawesome/brands/github

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - assets/javascripts/mermaid.min.js      # Mermaid 11.17.2 ospitato qui: Material non lo scarica più da unpkg.com
  - assets/javascripts/mermaid-lightbox.js
  - assets/javascripts/autore-header.js    # 'Prof. Giuseppe Bosi' nella barra in alto
  - assets/javascripts/language-switch.js  # selettore lingua sulla pagina corrispondente

plugins:
  - search:
      lang: it
  - awesome-nav
  - i18n:
      docs_structure: suffix
      fallback_to_default: true
      reconfigure_material: false
      reconfigure_search: true
      languages:
        - locale: it
          default: true
          name: Italiano
          build: true
        - locale: en
          name: English
          build: true
          site_name: llama.cpp Practical Course
          site_description: A hands-on llama.cpp course, from installation to production.
          theme:
            language: en
          copyright: '© 2026 <a href="https://www.giuseppebosi.com/en/">Prof. Giuseppe Bosi</a>, Master''s-level degree in Electronic Engineering (5-year Italian Laurea, pre-reform, EQF level 7), Teacher of Computer Science and Technology · <a href="https://www.linkedin.com/in/giuseppebosi">LinkedIn</a> · text and diagrams <a href="https://creativecommons.org/licenses/by/4.0/">CC BY 4.0</a>, lab code MIT · <a href="/en/informazioni/">About</a> · llama.cpp is an MIT project by ggml-org, not affiliated · <a href="https://github.com/JoeBosi/llama-cpp-course">Source code on GitHub</a> · Other courses: <a href="https://corso-api-json.giuseppebosi.com/">JSON & API</a>, <a href="https://corso-rag.giuseppebosi.com/">RAG</a>'
          nav_translations:
            Home: Home
            Il corso: Course
            Progetti finali: Final projects
            Risorse: Resources
            Informazioni: About
            "00 · Introduzione a llama.cpp": "00 · Introduction to llama.cpp"
            "01 · Installazione su varie piattaforme": "01 · Installing on every platform"
            "02 · Primi passi: llama cli": "02 · First steps: llama cli"
            "02b · Scegliere il modello per la tua macchina": "02b · Choosing the model for your machine"
            "03 · Modelli, GGUF e quantizzazione": "03 · Models, GGUF and quantization"
            "04 · llama serve: server e API": "04 · llama serve: server and API"
            "05 · Prestazioni e ottimizzazione": "05 · Performance and optimization"
            "06 · Output strutturato: grammatiche GBNF e JSON Schema": "06 · Structured output: GBNF grammars and JSON Schema"
            "07 · Multimodalità: visione, audio, voce": "07 · Multimodality: vision, audio, voice"
            "08 · Integrare llama.cpp nelle applicazioni": "08 · Integrating llama.cpp into applications"
            "09 · Messa in produzione": "09 · Going to production"
            "10 · Approfondimenti: dentro ggml e llama.cpp": "10 · Deep dives: inside ggml and llama.cpp"
  - glightbox
  - git-revision-date-localized:           # "Ultimo aggiornamento" in fondo a ogni pagina, dalla data del commit
      type: date
      locale: it
      fallback_to_build_date: true
      enable_creation_date: false

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - footnotes
  - def_list
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.keys
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:scripts.mermaid_fence.format_mermaid

extra:
  generator: false
  alternate:                 # attiva overrides/partials/alternate.html: bandierina IT/EN come su www.giuseppebosi.com
    - {name: Italiano, link: /, lang: it}
    - {name: English, link: /en/, lang: en}
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/ggml-org/llama.cpp
      name: llama.cpp su GitHub
